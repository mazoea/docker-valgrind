name: ☃ build-and-publish
on:
  push:
    tags:
      - '*'
  workflow_dispatch:

env:
  IMG_REPO: ghcr.io/mazoea/docker-valgrind
  JOBNAME: build-and-test

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    # arm64 is built under QEMU
    timeout-minutes: 30
    env:
      # arm64: c-image-to-text scheduled-tasks-RELEASE-arm runs valgrind on mazoea-linux-arm
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      - uses: mazoea/ga-maz/start@master

      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: build and validate
        run: |
          TAG=${{ env.IMG_REPO }}:${{ github.ref_name }}
          echo "Using TAG:$TAG"

          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          for p in ${PLATFORMS//,/ }; do
            echo "Validating image: $TAG ($p)"
            docker buildx build . -f Dockerfile --platform $p --load --tag $TAG
            docker run --rm --platform $p $TAG --version
          done

      # one multi-arch tag; the layers come from the build cache of the step above
      - name: push image
        run: |
          docker buildx build . -f Dockerfile --platform $PLATFORMS --tag ${{ env.IMG_REPO }}:${{ github.ref_name }} --push
        if: ${{ success() && github.ref_type == 'tag' }}

      - uses: mazoea/ga-maz/end@master
        if: ${{ always() }}
